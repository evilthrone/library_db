<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Читатель', 'Библиотечная система: Читатель', true)}"></head>
<body class="site-page db-page">
<header th:replace="~{fragments/site :: header('app')}"></header>
<main id="main-content" class="site-shell db-content" tabindex="-1">
    <header class="page-header">
        <h1>Читатель</h1>
        <p>Доступные функции для читателя</p>
    </header>

    <section class="card-grid">
        <a class="menu-card" th:href="@{/input}">
            <h3>Регистрация читателя</h3>
            <p>Добавление нового читателя в базу данных.</p>
        </a>

        <a class="menu-card" th:href="@{/search/one}">
            <h3>Поиск по одному атрибуту</h3>
            <p>Выбор жанра и просмотр книг выбранного жанра.</p>
        </a>

        <a class="menu-card" th:href="@{/search/two}">
            <h3>Поиск по двум синхронизированным атрибутам</h3>
            <p>Выбор автора, затем книги, принадлежащей этому автору.</p>
        </a>
    </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
