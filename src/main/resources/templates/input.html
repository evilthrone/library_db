<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Ввод данных', 'Библиотечная система: Ввод данных', true)}"></head>
<body class="site-page db-page">
<header th:replace="~{fragments/site :: header('app')}"></header>
<main id="main-content" class="site-shell db-content" tabindex="-1">
    <header class="page-header">
        <h1>Ввод данных</h1>
        <p>Добавление нового читателя</p>
    </header>

    <div class="success-box" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form class="form-card" th:action="@{/input}" th:object="${readerForm}" method="post">
        <div class="form-grid">
            <div class="full-width">
                <label>СУБД для записи</label>
                <select th:field="*{databaseTarget}">
                    <option th:each="target : ${databaseTargets}"
                            th:value="${target}"
                            th:text="${target.label}"></option>
                </select>
                <div class="error" th:errors="*{databaseTarget}"></div>
            </div>

            <div>
                <label>Фамилия</label>
                <input type="text" th:field="*{lastName}">
                <div class="error" th:errors="*{lastName}"></div>
            </div>

            <div>
                <label>Имя</label>
                <input type="text" th:field="*{firstName}">
                <div class="error" th:errors="*{firstName}"></div>
            </div>

            <div>
                <label>Отчество</label>
                <input type="text" th:field="*{middleName}">
                <div class="error" th:errors="*{middleName}"></div>
            </div>

            <div>
                <label>Дата рождения</label>
                <input type="date" th:field="*{birthDate}">
                <div class="error" th:errors="*{birthDate}"></div>
            </div>

            <div>
                <label>Телефон</label>
                <input type="text" th:field="*{phone}">
                <div class="error" th:errors="*{phone}"></div>
            </div>

            <div>
                <label>Email</label>
                <input type="email" th:field="*{email}">
                <div class="error" th:errors="*{email}"></div>
            </div>

            <div class="full-width">
                <label>Адрес</label>
                <input type="text" th:field="*{address}">
                <div class="error" th:errors="*{address}"></div>
            </div>
        </div>

        <button type="submit" class="btn-primary">Добавить читателя</button>
    </form>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
