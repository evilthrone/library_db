<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="error-page-card">
        <h1 th:text="${errorTitle}">Ошибка</h1>
        <p th:text="${errorMessage}">Произошла ошибка.</p>

        <div class="error-page-actions">
            <a class="btn-primary link-btn" th:href="@{/}">На главную</a>
            <a class="btn-secondary link-btn" href="javascript:history.back()">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
