spring.application.name=library_db

# PostgreSQL
app.datasource.postgres.jdbc-url=jdbc:postgresql://localhost:5432/library_db
app.datasource.postgres.username=${POSTGRES_DB_USERNAME:postgres}
app.datasource.postgres.password=${POSTGRES_DB_PASSWORD:}
app.datasource.postgres.driver-class-name=org.postgresql.Driver

# MySQL
app.datasource.mysql.jdbc-url=jdbc:mysql://localhost:3306/library_db_mysql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
app.datasource.mysql.username=${MYSQL_DB_USERNAME:root}
app.datasource.mysql.password=${MYSQL_DB_PASSWORD:}
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver


spring.thymeleaf.cache=false
server.port=8080
spring.mvc.hiddenmethod.filter.enabled=true
